<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARBY // LEVEL 21</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #79d9ff;
  font-family: Arial, sans-serif;
}

body {
  cursor: crosshair;
}

/* =========================
   GAME SCREEN
========================= */

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    linear-gradient(
      #58c9ff 0%,
      #a8ecff 58%,
      #8bdc68 59%,
      #4cae42 100%
    );
}

/* clouds */

.cloud {
  position: absolute;
  width: 130px;
  height: 45px;
  background: white;
  border-radius: 50px;
  opacity: .85;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: white;
  border-radius: 50%;
}

.cloud::before {
  width: 65px;
  height: 65px;
  left: 20px;
  top: -30px;
}

.cloud::after {
  width: 80px;
  height: 80px;
  right: 15px;
  top: -40px;
}

.cloud1 {
  top: 12%;
  left: 8%;
}

.cloud2 {
  top: 23%;
  right: 12%;
  transform: scale(.7);
}

.cloud3 {
  top: 8%;
  right: 35%;
  transform: scale(.5);
}

/* =========================
   TITLE SCREEN
========================= */

#titleScreen {
  position: absolute;
  inset: 0;
  z-index: 50;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.15),
      rgba(0,0,0,.35)
    );

  transition: opacity .6s;
}

.title-small {
  color: white;
  font-size: 14px;
  letter-spacing: 7px;
  font-weight: bold;
  text-shadow: 3px 3px #063b79;
  margin-bottom: 15px;
}

.title {
  font-family: Impact, Arial Black, sans-serif;
  font-size: clamp(75px, 17vw, 180px);
  color: white;
  letter-spacing: -5px;

  -webkit-text-stroke: 5px #063b79;

  text-shadow:
    9px 9px 0 #e32936,
    14px 14px 0 #063b79;

  transform: skew(-7deg);
}

.level {
  margin-top: 15px;
  color: white;
  font-size: clamp(25px, 5vw, 48px);
  font-weight: 900;
  letter-spacing: 8px;
  text-shadow: 4px 4px #063b79;
}

.startButton {
  margin-top: 55px;
  padding: 18px 55px;

  border: 4px solid white;
  border-radius: 8px;

  background: #0759b7;
  color: white;

  font-size: 20px;
  font-weight: 900;
  letter-spacing: 4px;

  box-shadow:
    0 8px 0 #063b79;

  cursor: pointer;

  transition: .15s;
}

.startButton:hover {
  transform: translateY(4px);
  box-shadow: 0 4px 0 #063b79;
}

.startButton:active {
  transform: translateY(8px);
  box-shadow: none;
}

.press {
  margin-top: 25px;
  color: white;
  font-size: 12px;
  letter-spacing: 3px;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: .35; }
}

/* =========================
   HUD
========================= */

#hud {
  position: absolute;
  z-index: 20;
  top: 18px;
  left: 20px;
  right: 20px;

  display: flex;
  justify-content: space-between;

  color: white;
  font-weight: 900;
  font-size: 17px;

  text-shadow: 3px 3px #063b79;

  pointer-events: none;
}

#hud span {
  margin-left: 5px;
}

/* =========================
   RINGS
========================= */

.ring {
  position: absolute;
  width: 38px;
  height: 38px;

  border: 7px solid #ffd21a;
  border-radius: 50%;

  box-shadow:
    inset 0 0 0 2px #ffef7a,
    0 3px 0 #b87900;

  animation:
    ringSpin .8s infinite alternate,
    ringFloat 1.8s infinite ease-in-out;

  cursor: pointer;
  z-index: 8;
}

@keyframes ringSpin {
  from {
    transform: scaleX(1);
  }

  to {
    transform: scaleX(.35);
  }
}

@keyframes ringFloat {
  50% {
    margin-top: -8px;
  }
}

.r1 { left: 25%; top: 38%; }
.r2 { left: 30%; top: 32%; }
.r3 { left: 35%; top: 38%; }
.r4 { right: 28%; top: 29%; }
.r5 { right: 22%; top: 35%; }
.r6 { right: 16%; top: 28%; }

/* =========================
   SPEEDSTER
========================= */

#speedster {
  position: absolute;
  z-index: 15;

  width: 90px;
  height: 90px;

  left: -130px;
  top: 55%;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 65% 35%,
      #ffffff 0 5%,
      transparent 6%
    ),
    #0759d9;

  box-shadow:
    inset -12px -10px 0 #053d9b,
    0 8px 0 rgba(0,0,0,.25);

  transform: rotate(0deg);

  display: none;
}

/* spikes */

#speedster::before {
  content: "";
  position: absolute;

  left: -45px;
  top: 5px;

  width: 0;
  height: 0;

  border-top: 25px solid transparent;
  border-bottom: 25px solid transparent;
  border-right: 65px solid #0759d9;

  transform: rotate(-12deg);
}

#speedster::after {
  content: "";
  position: absolute;

  right: -30px;
  bottom: -10px;

  width: 50px;
  height: 20px;

  border-radius: 50%;

  background: #e32936;
}

/* rolling */

.roll {
  display: block !important;

  animation:
    rollAcross 1.8s cubic-bezier(.2,.7,.2,1) forwards,
    spin 1.8s linear forwards;
}

@keyframes rollAcross {

  0% {
    left: -130px;
    top: 57%;
  }

  55% {
    top: 45%;
  }

  100% {
    left: 110vw;
    top: 50%;
  }
}

@keyframes spin {
  to {
    transform: rotate(1080deg);
  }
}

/* speed trails */

.speedTrail {
  position: absolute;
  width: 110px;
  height: 5px;

  background: white;
  border-radius: 20px;

  opacity: 0;

  z-index: 10;
}

.trail1 {
  top: 58%;
  left: 8%;
}

.trail2 {
  top: 63%;
  left: 18%;
}

.trail3 {
  top: 52%;
  left: 2%;
}

/* =========================
   GROUND
========================= */

.ground {
  position: absolute;
  bottom: 0;
  left: 0;

  width: 100%;
  height: 23%;

  background:
    repeating-linear-gradient(
      135deg,
      #2b9b42 0 20px,
      #23843a 20px 40px
    );

  border-top: 8px solid #f2d05b;

  z-index: 5;
}

/* checkerboard dirt */

.ground::after {
  content: "";

  position: absolute;
  left: 0;
  bottom: 0;

  width: 100%;
  height: 70%;

  background:
    repeating-conic-gradient(
      #9a552b 0 25%,
      #743d22 0 50%
    )
    0 / 55px 55px;
}

/* =========================
   PLATFORMS
========================= */

.platform {
  position: absolute;

  height: 28px;

  background: #e6bd45;

  border-top: 8px solid #62c44b;
  border-radius: 5px;

  z-index: 7;
}

.platform1 {
  width: 210px;
  left: 12%;
  bottom: 34%;
}

.platform2 {
  width: 180px;
  right: 15%;
  bottom: 43%;
}

.platform3 {
  width: 150px;
  left: 44%;
  bottom: 52%;
}

/* =========================
   INTERACTIVE OBJECTS
========================= */

.object {
  position: absolute;

  z-index: 12;

  cursor: pointer;

  transition: transform .2s;
}

.object:hover {
  transform: scale(1.12);
}

.sign {
  right: 8%;
  bottom: 25%;

  width: 130px;
  padding: 12px;

  background: #f5d547;

  border: 5px solid #7b4a1f;

  color: #173f86;

  text-align: center;

  font-weight: 900;

  box-shadow: 5px 5px rgba(0,0,0,.3);
}

.photoSpot {
  left: 7%;
  bottom: 28%;

  width: 75px;
  height: 95px;

  background: white;

  padding: 6px;

  transform: rotate(-7deg);

  box-shadow: 6px 6px rgba(0,0,0,.35);
}

.photoSpot::after {
  content: "MEMORY";
  position: absolute;
  color: #111;
  font-size: 8px;
  bottom: 4px;
  left: 12px;
}

.musicSpot {
  right: 7%;
  top: 30%;

  width: 100px;
  height: 70px;

  background: #202020;

  border: 4px solid #ddd;

  border-radius: 8px;

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 11px;
}

/* =========================
   POPUP
========================= */

#popup {
  position: absolute;
  inset: 0;

  z-index: 100;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.72);

  padding: 25px;
}

.popupBox {
  width: min(650px, 94vw);

  max-height: 88vh;

  overflow: auto;

  background: #f4f0dc;

  color: #111;

  border: 7px solid #0759d9;

  box-shadow:
    12px 12px #e32936;

  padding: 28px;

  text-align: center;
}

.popupBox h2 {
  font-family: Impact, Arial Black, sans-serif;
  font-size: 38px;
  margin-bottom: 18px;
}

.popupBox img {
  max-width: 100%;
  max-height: 55vh;
  object-fit: contain;
}

.popupText {
  font-family: Georgia, serif;
  font-size: 18px;
  line-height: 1.7;
  margin: 15px 0;
}

.closeButton {
  margin-top: 20px;

  border: 0;

  padding: 12px 25px;

  background: #0759d9;
  color: white;

  font-weight: bold;

  cursor: pointer;
}

/* =========================
   FINAL SCREEN
========================= */

#finalScreen {
  position: absolute;
  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  text-align: center;

  background:
    linear-gradient(
      #55cfff,
      #8be36c
    );

  padding: 30px;
}

.finalBox {
  max-width: 800px;

  color: white;

  text-shadow: 4px 4px #063b79;
}

.finalBox h1 {
  font-family: Impact, Arial Black, sans-serif;

  font-size: clamp(55px, 13vw, 130px);

  line-height: .9;

  margin-bottom: 30px;
}

.finalBox p {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.7;
}

</style>
</head>

<body>

<div id="game">

  <!-- TITLE -->

  <div id="titleScreen">

    <div class="title-small">
      SPECIAL BIRTHDAY EDITION
    </div>

    <div class="title">
      DARBY
    </div>

    <div class="level">
      LEVEL 21
    </div>

    <button class="startButton" onclick="startGame()">
      PRESS START
    </button>

    <div class="press">
      PLAYER 1 READY
    </div>

  </div>


  <!-- WORLD -->

  <div id="hud">
    <div>
      RINGS <span id="ringCount">0</span>
    </div>

    <div>
      MEMORIES <span id="memoryCount">0</span>/4
    </div>

    <div>
      LEVEL 21
    </div>
  </div>


  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>


  <!-- RINGS -->

  <div class="ring r1" onclick="collectRing(this)"></div>
  <div class="ring r2" onclick="collectRing(this)"></div>
  <div class="ring r3" onclick="collectRing(this)"></div>
  <div class="ring r4" onclick="collectRing(this)"></div>
  <div class="ring r5" onclick="collectRing(this)"></div>
  <div class="ring r6" onclick="collectRing(this)"></div>


  <!-- SPEEDSTER -->

  <div id="speedster"></div>

  <div class="speedTrail trail1"></div>
  <div class="speedTrail trail2"></div>
  <div class="speedTrail trail3"></div>


  <!-- PLATFORMS -->

  <div class="platform platform1"></div>
  <div class="platform platform2"></div>
  <div class="platform platform3"></div>


  <!-- GROUND -->

  <div class="ground"></div>


  <!-- INTERACTIVE MEMORY -->

  <div
    class="object photoSpot"
    onclick="openMemory(1)"
    title="Memory"
  ></div>


  <!-- MUSIC -->

  <div
    class="object musicSpot"
    onclick="openMusic()"
  >
    MUSIC
  </div>


  <!-- FINAL SIGN -->

  <div
    class="object sign"
    onclick="openMessage()"
  >
    CHECKPOINT<br><br>
    ENTER
  </div>


  <!-- POPUP -->

  <div id="popup">

    <div class="popupBox">

      <h2 id="popupTitle"></h2>

      <div id="popupContent"></div>

      <button
        class="closeButton"
        onclick="closePopup()"
      >
        CONTINUE
      </button>

    </div>

  </div>


  <!-- FINAL -->

  <div id="finalScreen">

    <div class="finalBox">

      <h1>
        LEVEL 21<br>
        COMPLETE
      </h1>

      <p>
        HAPPY BIRTHDAY, DARBY
      </p>

      <p>
        YOU'VE UNLOCKED YOUR FINAL MESSAGE.
      </p>

      <br>

      <button
        class="startButton"
        onclick="openMessage()"
      >
        OPEN MESSAGE
      </button>

    </div>

  </div>

</div>


<script>

let rings = 0;
let memories = 0;


/* START GAME */

function startGame() {

  const title = document.getElementById("titleScreen");

  title.style.opacity = "0";

  const speedster = document.getElementById("speedster");

  setTimeout(() => {

    title.style.display = "none";

    speedster.classList.add("roll");

    document.querySelectorAll(".speedTrail").forEach(
      trail => {

        trail.style.opacity = "1";

        trail.style.animation =
          "trailMove 1s linear infinite";

      }
    );

  }, 500);

}


/* RINGS */

function collectRing(ring) {

  ring.style.display = "none";

  rings++;

  document.getElementById("ringCount").textContent = rings;

  if (rings === 6) {

    setTimeout(() => {

      showPopup(
        "ALL RINGS COLLECTED",
        "<p class='popupText'>Nice! You found every ring on this part of the level.</p>"
      );

    }, 300);

  }

}


/* MEMORY */

function openMemory(number) {

  if (memories >= 4) return;

  memories++;

  document.getElementById("memoryCount").textContent = memories;

  const photos = [
    "251bbf52-e032-4ecc-a542-3c32b40bf0b9.jpeg",
    "38514dda-9de0-41f1-8a3e-acdd58962246.jpeg",
    "IMG_6582.jpeg",
    "IMG_6585.jpeg"
  ];

  const photo = photos[memories - 1];

  showPopup(
    "MEMORY FOUND",
    `
      <img src="${photo}" alt="Memory ${memories}">
      <p class="popupText">
        MEMORY ${memories} / 4
      </p>
    `
  );

}


/* MUSIC */

function openMusic() {

  showPopup(
    "MUSIC PLAYER",
    `
      <p class="popupText">
        MUSIC PLAYER UNLOCKED
      </p>

      <p class="popupText">
        Your song isn't selected yet.
        Come back when you're ready.
      </p>

      <p class="popupText">
        TRACK: ??????
      </p>
    `
  );

}


/* MESSAGE */

function openMessage() {

  showPopup(
    "NEW MESSAGE",
    `
      <p class="popupText">
        Feliz cumpleaños, David!
      </p>

      <p class="popupText">
        Te deseo un día maravilloso. Te aprecio muchísimo
        y estoy muy agradecida de tenerte en mi vida.
        Espero verte pronto y poder seguir compartiendo
        momentos y creando recuerdos juntos.
      </p>

      <p class="popupText">
        Espero que con este nuevo capítulo sigas creciendo
        como persona, te acerques más a Dios y seas diez veces
        mejor. Te deseo lo mejor y espero que logres cumplir
        todos tus sueños, incluso los más pequeños.
      </p>

      <p class="popupText">
        "Porque yo sé los planes que tengo para ustedes,
        planes de bienestar y no de calamidad, para darles
        un futuro y una esperanza."
      </p>

      <p class="popupText">
        — Jeremías 29:11
      </p>

      <p class="popupText">
        Te quiero mucho.<br>
        Besos,<br>
        Tiffany
      </p>
    `
  );

}


/* POPUP */

function showPopup(title, content) {

  document.getElementById("popupTitle").textContent = title;

  document.getElementById("popupContent").innerHTML = content;

  document.getElementById("popup").style.display = "flex";

}


function closePopup() {

  document.getElementById("popup").style.display = "none";

}


/* =========================
   TRAIL ANIMATION
========================= */

const styleSheet = document.createElement("style");

styleSheet.innerHTML = `

@keyframes trailMove {

  0% {
    transform: translateX(-100px);
    opacity: 0;
  }

  30% {
    opacity: .8;
  }

  100% {
    transform: translateX(500px);
    opacity: 0;
  }

}

`;

document.head.appendChild(styleSheet);

</script>

</body>
</html>
